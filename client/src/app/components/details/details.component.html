<div id="prod_details_container">
    <div id="img_div">
        <img  src="../../../assets/{{currentProd.img}}" alt="image">
    </div>
    <div id="prod_info">
        <h1>{{currentProd.name}}</h1>
        <h2>{{currentProd.desc}}</h2>
        <h4>מחיר: {{currentProd.price}} ₪</h4>
        @if(currentProd.model!=null){
            <h4>דגם: {{currentProd.model}}</h4>
        }
        <h4>קטגוריה: {{currentProd.categoryName}}</h4>
        @if(currentProd.amountInStock!>0){
            <p>נותרו רק {{currentProd.amountInStock!}} יחידות</p>
        }
        @else{
            <p>אזל מהמלאי</p>
        }
        <br>
        <br>
        <button class="btn btn-primary" [disabled]="0==currentProd.amountInStock!" style="margin-left: 10px;" (click)="addToCart(currentProd.id!)">הוסף לעגלה</button>
        <button class="btn btn-secondary" (click)="back()">חזרה לתפריט קודם</button>
    </div>
</div>
